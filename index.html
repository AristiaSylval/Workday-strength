<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#173b63" />
  <title>Workday Strength Rotation</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #16324f;
      --muted: #667788;
      --blue: #1f5a99;
      --green: #2f6f3e;
      --purple: #6a4fa3;
      --border: #dbe3ea;
      --shadow: 0 8px 24px rgba(22, 50, 79, 0.08);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .app {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px 16px calc(28px + env(safe-area-inset-bottom));
    }
    header {
      margin: 8px 0 18px;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.9rem, 7vw, 3rem);
      line-height: 0.98;
      letter-spacing: -0.04em;
    }
    .sub {
      color: var(--muted);
      margin-top: 8px;
      font-size: 0.98rem;
    }
    .group-picker {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 18px 0;
    }
    .group-btn {
      border: 0;
      border-radius: 16px;
      padding: 14px 8px;
      color: white;
      font-weight: 800;
      font-size: 1rem;
      box-shadow: var(--shadow);
      cursor: pointer;
      opacity: 0.78;
      transition: transform .15s ease, opacity .15s ease, outline .15s ease;
    }
    .group-btn[data-group="A"] { background: var(--blue); }
    .group-btn[data-group="B"] { background: var(--green); }
    .group-btn[data-group="C"] { background: var(--purple); }
    .group-btn.active { opacity: 1; outline: 3px solid rgba(22,50,79,.14); transform: translateY(-1px); }

    .section-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .section-head {
      color: white;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    .section-head.a { background: var(--blue); }
    .section-head.b { background: var(--green); }
    .section-head.c { background: var(--purple); }
    .section-title { font-weight: 800; font-size: 1.08rem; }
    .section-focus { font-size: .86rem; opacity: .9; text-align: right; }

    .exercise {
      padding: 16px;
      border-top: 1px solid var(--border);
    }
    .exercise:first-of-type { border-top: none; }
    .exercise h3 {
      margin: 0 0 12px;
      font-size: 1.14rem;
    }
    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    label {
      display: grid;
      gap: 5px;
      font-size: .76rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    input[type="text"] {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 12px;
      font: inherit;
      color: var(--text);
      background: #fbfcfe;
    }
    .sets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .set-check {
      position: relative;
    }
    .set-check input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .set-check span {
      min-height: 48px;
      border: 1px solid var(--border);
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: #fbfcfe;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
    }
    .set-check input:checked + span {
      background: #eaf4ec;
      border-color: #91bc9a;
      color: #205d2e;
    }
    .set-check input:checked + span::before {
      content: "✓ ";
    }
    .cue {
      margin-top: 10px;
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.35;
    }
    .optional {
      margin: 0 16px 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #f2f7f2;
      color: #31533a;
      font-size: .9rem;
      border: 1px dashed #a8c2ad;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 16px 0 18px;
    }
    button.action {
      min-height: 48px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: white;
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    button.primary { background: var(--text); color: white; border-color: var(--text); }

    .stretch-card {
      padding: 16px;
    }
    .stretch-card h2 { margin: 0 0 10px; font-size: 1.05rem; }
    .stretch-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      color: var(--muted);
      font-size: .93rem;
    }
    .progress {
      margin-top: 12px;
      font-size: .9rem;
      color: var(--muted);
    }
    .progress strong { color: var(--text); }
    .install-note {
      margin-top: 12px;
      font-size: .82rem;
      color: var(--muted);
    }
    @media (min-width: 560px) {
      .stretch-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>Workday Strength Rotation</h1>
      <div class="sub">Pick one group for the day. Do each exercise 3 times throughout your workday.</div>
    </header>

    <div class="group-picker" aria-label="Choose workout group">
      <button class="group-btn active" data-group="A">Group A</button>
      <button class="group-btn" data-group="B">Group B</button>
      <button class="group-btn" data-group="C">Group C</button>
    </div>

    <section id="groupCard" class="section-card"></section>

    <div class="actions">
      <button id="resetSets" class="action">Reset today</button>
      <button id="nextGroup" class="action primary">Next group</button>
    </div>

    <section class="section-card stretch-card">
      <h2>Stretch throughout the day</h2>
      <div class="stretch-grid">
        <div><strong>Chest stretch</strong><br>20–30 sec as needed</div>
        <div><strong>Hip flexor stretch</strong><br>20–30 sec each side</div>
        <div><strong>Neck stretch</strong><br>20–30 sec each side</div>
      </div>
      <div id="progress" class="progress"></div>
      <div class="install-note">Your weights, reps and checkmarks are saved on this device.</div>
    </section>
  </main>

  <script>
    const groups = {
      A: {
        focus: 'Full body strength',
        className: 'a',
        exercises: [
          { id: 'squat_press', name: 'Squat → Overhead Press', weight: '15 lb each', reps: '10 reps', cue: 'Hold at shoulder height, squat, then press overhead as you stand.' },
          { id: 'row', name: 'Bent-Over Row', weight: '20 lb each', reps: '10 reps', cue: 'Hinge at the hips and pull the dumbbells toward your hips with a flat back.' },
          { id: 'farmer', name: "Farmer's Carry", weight: '25 lb each', reps: '1 minute', cue: 'Stand tall, brace your core and walk at a comfortable pace.' }
        ]
      },
      B: {
        focus: 'Hinge, posture & core',
        className: 'b',
        optional: 'Optional: replace the regular RDL with a single-leg RDL on some days (about 8 reps each leg).',
        exercises: [
          { id: 'rdl', name: 'Romanian Deadlift (RDL)', weight: '35 lb', reps: '15 reps', cue: 'Push your hips back, keep your back flat, then squeeze your glutes to stand.' },
          { id: 'face_pull', name: 'Face Pull', weight: '20 lb', reps: '10 reps', cue: 'Pull toward your face, lead with your elbows and squeeze your shoulder blades together.' },
          { id: 'pallof', name: 'Pallof Press', weight: '', reps: '10 reps each side', cue: 'Press straight out and resist rotation. Keep your ribs and hips square.' }
        ]
      },
      C: {
        focus: 'Lateral strength & stability',
        className: 'c',
        exercises: [
          { id: 'lateral_lunge', name: 'Lateral Lunge', weight: 'Bodyweight', reps: '10 reps each side', cue: 'Step wide, sit back into one hip and keep the other leg relatively straight.' },
          { id: 'monster_walk', name: 'Monster Walk', weight: 'Resistance band', reps: '10–15 steps each direction', cue: 'Keep tension on the band and take controlled side steps with knees softly bent.' },
          { id: 'suitcase', name: 'Suitcase Carry', weight: '30 lb', reps: '1 minute each side', cue: 'Hold one weight at your side and walk without leaning.' }
        ]
      }
    };

    const STORAGE_KEY = 'workday-strength-pwa-v1';
    const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    state.selectedGroup = state.selectedGroup || 'A';
    state.exercises = state.exercises || {};

    function ensureExercise(ex) {
      if (!state.exercises[ex.id]) {
        state.exercises[ex.id] = { weight: ex.weight, reps: ex.reps, sets: [false, false, false] };
      }
      return state.exercises[ex.id];
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      updateProgress();
    }

    function render() {
      const g = groups[state.selectedGroup];
      document.querySelectorAll('.group-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.group === state.selectedGroup));
      const card = document.getElementById('groupCard');
      card.innerHTML = `
        <div class="section-head ${g.className}">
          <div class="section-title">Group ${state.selectedGroup}</div>
          <div class="section-focus">${g.focus}</div>
        </div>
        ${g.exercises.map((ex, idx) => {
          const s = ensureExercise(ex);
          return `
            <div class="exercise" data-id="${ex.id}">
              <h3>${idx + 1}. ${ex.name}</h3>
              <div class="fields">
                <label>Weight
                  <input type="text" class="weight" value="${escapeHtml(s.weight)}" aria-label="${ex.name} weight" />
                </label>
                <label>Reps / Time
                  <input type="text" class="reps" value="${escapeHtml(s.reps)}" aria-label="${ex.name} reps or time" />
                </label>
              </div>
              <div class="sets">
                ${[0,1,2].map(i => `
                  <label class="set-check">
                    <input type="checkbox" class="set" data-set="${i}" ${s.sets[i] ? 'checked' : ''} />
                    <span>Set ${i+1}</span>
                  </label>`).join('')}
              </div>
              <div class="cue">${ex.cue}</div>
            </div>`;
        }).join('')}
        ${g.optional ? `<div class="optional">${g.optional}</div>` : ''}
      `;

      card.querySelectorAll('.exercise').forEach(el => {
        const id = el.dataset.id;
        const exState = state.exercises[id];
        el.querySelector('.weight').addEventListener('input', e => { exState.weight = e.target.value; save(); });
        el.querySelector('.reps').addEventListener('input', e => { exState.reps = e.target.value; save(); });
        el.querySelectorAll('.set').forEach(cb => {
          cb.addEventListener('change', e => {
            exState.sets[Number(e.target.dataset.set)] = e.target.checked;
            save();
          });
        });
      });
      save();
    }

    function updateProgress() {
      const g = groups[state.selectedGroup];
      const total = g.exercises.length * 3;
      const done = g.exercises.reduce((sum, ex) => sum + ensureExercise(ex).sets.filter(Boolean).length, 0);
      document.getElementById('progress').innerHTML = `<strong>${done}/${total} sets complete</strong> for Group ${state.selectedGroup} today.`;
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }

    document.querySelectorAll('.group-btn').forEach(btn => {
      btn.addEventListener('click', () => { state.selectedGroup = btn.dataset.group; save(); render(); });
    });

    document.getElementById('resetSets').addEventListener('click', () => {
      groups[state.selectedGroup].exercises.forEach(ex => ensureExercise(ex).sets = [false,false,false]);
      save(); render();
    });

    document.getElementById('nextGroup').addEventListener('click', () => {
      const order = ['A','B','C'];
      state.selectedGroup = order[(order.indexOf(state.selectedGroup)+1)%order.length];
      save(); render();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }

    render();
  </script>
</body>
</html>
